<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /** 全局重置 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /** 页面主体 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 32px 32px;
    background: #1f2937; color: #e5e7eb;
    -webkit-app-region: drag;
    user-select: none;
  }
  /** 头部区域：图标 + 名称版本横向排列 */
  .header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 28px; width: 100%;
  }
  /** 应用图标 */
  .app-icon {
    width: 64px; height: 64px; flex-shrink: 0;
    border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  /** 头部文字区域 */
  .header-text {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  /** 应用名称 */
  .app-name {
    font-size: 18px; font-weight: 700;
    color: #f9fafb;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /** 应用版本 */
  .app-version {
    font-size: 13px; color: #9ca3af;
  }
  /** 信息表格 */
  .info-table {
    width: 100%; border-collapse: collapse;
  }
  /** 表格单元格 */
  .info-table td {
    padding: 8px 0; font-size: 13px;
    border-bottom: 1px solid #374151;
  }
  /** 信息标签列 */
  .info-label {
    color: #9ca3af; width: 70px; white-space: nowrap;
  }
  /** 信息值列 */
  .info-value {
    color: #d1d5db; text-align: right;
  }
  /** 网站链接 */
  .info-value a {
    color: #60a5fa; text-decoration: none;
  }
  /** 网站链接悬停态 */
  .info-value a:hover {
    text-decoration: underline;
  }
  /** 底部版权信息 */
  .footer {
    margin-top: 24px; font-size: 12px; color: #6b7280;
  }
</style>
</head>
<body>
  <!-- 头部：图标 + 名称版本 -->
  <div class="header">
    <img class="app-icon" src="{{ICON}}">
    <div class="header-text">
      <div class="app-name">{{NAME}}</div>
      <div class="app-version">{{VERSION_LABEL}}: {{VERSION}}</div>
    </div>
  </div>
  <!-- 信息表格 -->
  <table class="info-table">
    <tr>
      <td class="info-label">{{AUTHOR_LABEL}}</td>
      <td class="info-value">{{AUTHOR}}</td>
    </tr>
    <tr>
      <td class="info-label">{{DESCRIPTION_LABEL}}</td>
      <td class="info-value">{{DESCRIPTION}}</td>
    </tr>
    <tr>
      <td class="info-label">{{WEBSITE_LABEL}}</td>
      <td class="info-value"><a href="https://{{WEBSITE}}" id="website-link">{{WEBSITE}}</a></td>
    </tr>
  </table>
  <!-- 底部版权 -->
  <div class="footer">{{NAME}} &copy; {{YEAR}}</div>
</body>
</html>
